title: Codex Pulse
views:
  - title: Overview
    path: codex-pulse
    icon: mdi:chart-donut
    cards:
      - type: gauge
        name: Primary limit usage
        entity: sensor.codex_pulse_primary_limit_usage
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 85
      - type: gauge
        name: Secondary limit usage
        entity: sensor.codex_pulse_secondary_limit_usage
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 85
      - type: entities
        title: Codex windows
        entities:
          - entity: sensor.codex_pulse_primary_limit_reset
          - entity: sensor.codex_pulse_primary_limit_window
          - entity: sensor.codex_pulse_secondary_limit_reset
          - entity: sensor.codex_pulse_secondary_limit_window
          - entity: sensor.codex_pulse_plan
          - entity: sensor.codex_pulse_available_limit_resets
